{% extends "base.html" %}

{% block title %}
{{ t("Chat - GrainWala","चैट - ग्रेनवाला") }}
{% endblock %}

{% block content %}
<style>
.container {
    max-width: 1200px;
    margin: auto;
    padding: 0 20px;
}

.chat-container {
    display: flex;
    flex-direction: column;
    height: 80vh;
    border: 1px solid #ddd;
    border-radius: 10px;
    background-color: #f9f9f9;
    overflow: hidden;
}

/* Header */
.chat-header {
    padding: 15px;
    background-color: #27ae60;
    color: white;
    font-size: 1.5rem;
    font-weight: bold;
}

/* Messages */
.chat-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background-color: #fefefe;
}

.message {
    max-width: 70%;
    padding: 10px 15px;
    border-radius: 15px;
    font-size: 1rem;
    line-height: 1.4;
}

.message.user {
    background-color: #27ae60;
    color: white;
    align-self: flex-end;
}

.message.bot {
    background-color: #e6f9e6;
    color: #333;
    align-self: flex-start;
}

/* Input */
.chat-input {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ddd;
    background-color: #fff;
}

.chat-input input {
    flex: 1;
    padding: 10px 15px;
    border: 1px solid #ccc;
    border-radius: 20px;
    outline: none;
    font-size: 1rem;
}

.chat-input button {
    margin-left: 10px;
    padding: 10px 20px;
    background-color: #27ae60;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
}

.chat-input button:hover {
    background-color: #219150;
}

/* Scrollbar */
.chat-messages::-webkit-scrollbar {
    width: 6px;
}
.chat-messages::-webkit-scrollbar-thumb {
    background-color: #27ae60;
    border-radius: 3px;
}
</style>

<div class="container">
    <div class="chat-container">

        <div class="chat-header">
            {{ t("GrainWala Chat","ग्रेनवाला चैट") }}
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- Messages -->
        </div>

        <div class="chat-input">
            <input type="text" id="userInput"
                   placeholder="{{ t('Type your message...','अपना संदेश लिखें...') }}">
            <button id="sendBtn">
                {{ t("Send","भेजें") }}
            </button>
        </div>

    </div>
</div>

<script>
const chatMessages = document.getElementById('chatMessages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

// Add message
function appendMessage(sender, text) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender);
    msgDiv.textContent = text;
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

sendBtn.addEventListener('click', () => {
    const message = userInput.value.trim();
    if(message === '') return;

    appendMessage('user', message);
    userInput.value = '';

    setTimeout(() => {
        appendMessage(
          'bot',
          "{{ t('Thanks for your message!','आपके संदेश के लिए धन्यवाद!') }}"
        );
    }, 500);
});

userInput.addEventListener('keypress', (e) => {
    if(e.key === 'Enter') sendBtn.click();
});
</script>
{% endblock %}
